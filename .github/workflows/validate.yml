name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and generated OPML
        run: python scripts/catalog.py check

  live-feeds:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check published feeds
        run: python scripts/live_check.py --output live-validation.json --concurrency 8 --timeout 20 --min-success-rate 0.70
      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-feed-validation
          path: live-validation.json
          retention-days: 30
